# Multithreaded HTTP Server configuration
# Lines starting with # are comments. Format: key = value

# Address to listen on. 0.0.0.0 = all interfaces, 127.0.0.1 = this machine only.
host = 0.0.0.0

# Port to listen on. The PORT environment variable overrides this
# (cloud platforms usually set it for you).
port = 9090

# Number of worker threads in the pool.
workers = 4

# How many accepted connections may wait for a free worker.
# When full, new clients get "503 Service Unavailable".
queue_limit = 128

# Folder that is served to clients (relative to where you start the server).
document_root = public

# Maximum size of the request line + headers, in bytes.
max_request_size = 8192

# Seconds a client has to finish sending its request.
read_timeout = 5
